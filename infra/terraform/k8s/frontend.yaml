apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: shoppulse
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      nodeSelector:
        workload: apps
      containers:
        - name: frontend
          image: ACR_LOGIN_SERVER/shoppulse-frontend:IMAGE_TAG
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: shoppulse
spec:
  # ClusterIP, not LoadBalancer: the ingress controller is the only public address.
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
