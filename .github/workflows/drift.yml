# Nightly check that deployed Azure resources still match the committed Terraform code.
# Anything changed by hand in the portal shows up here as drift and opens an issue.
#
# Enable by setting the repository variable DRIFT_CHECK_ENABLED to "true" once the stack is
# actually applied. While the environment is torn down every plan reports the whole stack as
# missing, which would open a useless issue every night.
#
# Uses the same OIDC identity and state variables as terraform-plan.yml, plus a federated
# credential for the branch this runs on:
#   "subject": "repo:LeoM0303/Shopppulse_SS:ref:refs/heads/main"

name: Drift detection

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  issues: write

jobs:
  drift:
    name: Detect infrastructure drift
    if: vars.DRIFT_CHECK_ENABLED == 'true' && vars.TFSTATE_STORAGE_ACCOUNT != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    env:
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: latest
          terraform_wrapper: false

      - name: terraform init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
            -backend-config="key=${{ vars.TFSTATE_KEY }}"

      # -detailed-exitcode: 0 = in sync, 2 = drift, 1 = the plan itself failed.
      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform plan -detailed-exitcode -no-color -input=false -lock=false -var-file=envs/dev.tfvars 2>&1 | tee plan.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Summarise
        run: |
          {
            echo "### Drift check"
            echo ""
            case "${{ steps.plan.outputs.exit_code }}" in
              0) echo "Infrastructure matches the code." ;;
              2) echo "Drift detected." ;;
              *) echo "Plan failed, see the job log." ;;
            esac
            echo ""
            echo '```'
            tail -n 60 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the drift issue
        if: steps.plan.outputs.exit_code == '2'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const title = 'Infrastructure drift detected';
            const limit = 50000;

            let plan = fs.readFileSync('infra/terraform/plan.txt', 'utf8');
            if (plan.length > limit) {
              plan = `... truncated ...\n\n${plan.slice(-limit)}`;
            }

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Drift found on ${new Date().toISOString().slice(0, 10)} by [this run](${runUrl}).`,
              '',
              'Either apply the code to bring Azure back in line, or update the code if the change was intentional.',
              '',
              '<details><summary>Plan output</summary>',
              '',
              '```terraform',
              plan,
              '```',
              '',
              '</details>',
            ].join('\n');

            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'drift' });
            const existing = open.data.find((i) => i.title === title);

            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body, labels: ['drift'] });
            }

      - name: Fail if the plan errored
        run: test "${{ steps.plan.outputs.exit_code }}" != "1"
