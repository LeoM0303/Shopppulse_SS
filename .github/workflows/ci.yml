# Actions are pinned to commit SHAs; the trailing comment records the release they came from.
# Scanner images intentionally track :latest so vulnerability and policy data stays fresh.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      manifests: ${{ steps.filter.outputs.manifests }}
      python: ${{ steps.filter.outputs.python }}
      frontend: ${{ steps.filter.outputs.frontend }}
      dockerfiles: ${{ steps.filter.outputs.dockerfiles }}
      services: ${{ steps.services.outputs.services }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            terraform:
              - 'infra/terraform/**'
              - '.github/workflows/ci.yml'
            manifests:
              - 'infra/terraform/k8s/**'
              - 'docker-compose.yml'
              - '.yamllint.yml'
              - '.github/workflows/**'
            python:
              - 'api/**'
              - 'worker/**'
              - '.github/workflows/ci.yml'
            dockerfiles:
              - '**/Dockerfile'
              - '.github/workflows/ci.yml'
            api:
              - 'api/**'
              - '.github/workflows/ci.yml'
            worker:
              - 'worker/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

      # Turn the per-service flags into a matrix, so an api-only change builds one image.
      - id: services
        run: |
          list=()
          [ "${{ steps.filter.outputs.api }}" = "true" ] && list+=('"api"')
          [ "${{ steps.filter.outputs.worker }}" = "true" ] && list+=('"worker"')
          [ "${{ steps.filter.outputs.frontend }}" = "true" ] && list+=('"frontend"')
          joined=$(IFS=,; echo "${list[*]}")
          echo "services=[$joined]" >> "$GITHUB_OUTPUT"
          echo "Will build: [$joined]"

  terraform:
    name: Terraform fmt, validate, lint
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: latest
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive

      # No backend: validation must not touch Azure or any remote state.
      - name: terraform init
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate -no-color

      - uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: latest

      # Advisory for now: tflint findings do not block the pipeline yet.
      - name: tflint
        continue-on-error: true
        run: |
          tflint --init
          tflint --recursive --minimum-failure-severity=error

  manifests:
    name: YAML lint and manifest schemas
    needs: changes
    if: needs.changes.outputs.manifests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install yamllint
        run: pipx install yamllint

      - name: yamllint
        run: yamllint -c .yamllint.yml infra/terraform/k8s docker-compose.yml .github/workflows

      # Manifests carry placeholders (ACR_LOGIN_SERVER, IMAGE_TAG) that stay valid YAML.
      # KEDA ScaledObject is a CRD, hence -ignore-missing-schemas.
      - name: kubeconform
        run: |
          docker run --rm -v "$PWD":/work ghcr.io/yannh/kubeconform:latest \
            -strict -ignore-missing-schemas -summary /work/infra/terraform/k8s

  python:
    name: Python lint
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ruff
        run: pipx install ruff

      - name: ruff check
        run: ruff check api worker

  frontend:
    name: Frontend type check
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      # No package-lock.json in the repo, so npm ci is not an option yet.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # vite build strips types without checking them; this is the only type gate.
      - name: tsc --noEmit
        run: npx tsc --noEmit

  dockerfiles:
    name: Dockerfile lint
    needs: changes
    if: needs.changes.outputs.dockerfiles == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: hadolint
        run: |
          for file in api/Dockerfile worker/Dockerfile frontend/Dockerfile; do
            echo "::group::$file"
            docker run --rm -i hadolint/hadolint:latest \
              hadolint --failure-threshold error - < "$file"
            echo "::endgroup::"
          done

  security:
    name: Secret and IaC scanning
    needs: changes
    runs-on: ubuntu-latest
    steps:
      # Full history: a secret removed in a later commit is still a leaked secret.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: gitleaks
        run: |
          docker run --rm -v "$PWD":/repo ghcr.io/gitleaks/gitleaks:latest \
            git /repo --redact --no-banner

      # Advisory: establishes a baseline before any of these become blocking.
      - name: checkov
        if: needs.changes.outputs.terraform == 'true'
        run: |
          docker run --rm -v "$PWD":/src bridgecrew/checkov:latest \
            -d /src/infra/terraform --framework terraform --compact --quiet --soft-fail \
            | tee checkov.txt
          {
            echo '### Checkov (advisory)'
            echo '```'
            tail -n 40 checkov.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.service }} image
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.service }}
          push: false
          load: true
          tags: shoppulse-${{ matrix.service }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report known vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivycache":/root/.cache/trivy \
            aquasec/trivy:latest image \
            --exit-code 0 --severity HIGH,CRITICAL --no-progress \
            shoppulse-${{ matrix.service }}:ci

      # Blocking, but only for CRITICAL issues that actually have a fix available.
      - name: Fail on fixable critical vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivycache":/root/.cache/trivy \
            aquasec/trivy:latest image \
            --exit-code 1 --severity CRITICAL --ignore-unfixed --no-progress --quiet \
            shoppulse-${{ matrix.service }}:ci

  # Single required check for branch protection: green only if nothing failed.
  ci-ok:
    name: CI OK
    if: always()
    needs: [changes, terraform, manifests, python, frontend, dockerfiles, security, build]
    runs-on: ubuntu-latest
    steps:
      - name: Verify job results
        run: |
          echo '${{ toJSON(needs) }}' | tee results.json
          jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")' results.json > /dev/null
