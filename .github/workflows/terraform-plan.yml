# Runs `terraform plan` against real Azure state and posts the result on the pull request,
# so infrastructure changes are reviewed before anyone applies them.
#
# Setup (in addition to the app registration described in deploy.yml)
# -------------------------------------------------------------------
# 1. Run scripts/bootstrap-state.ps1 once, then migrate local state:
#      terraform init -backend-config=backend.hcl -migrate-state
# 2. Give the OIDC service principal read access plus state access:
#      Reader                        on the subscription or the resource group
#      Storage Blob Data Contributor on the state storage account
#    Plan needs Reader only; it never writes infrastructure.
# 3. Add a federated credential for pull requests, since this job runs outside an environment:
#      "subject": "repo:LeoM0303/Shopppulse_SS:pull_request"
# 4. Repository variables (Settings > Secrets and variables > Actions > Variables):
#      AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
#      TFSTATE_RESOURCE_GROUP, TFSTATE_STORAGE_ACCOUNT, TFSTATE_CONTAINER, TFSTATE_KEY
#
# Until those variables exist the job skips instead of failing.

name: Terraform plan

on:
  pull_request:
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/terraform-plan.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: tfplan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan against Azure
    if: vars.AZURE_CLIENT_ID != '' && vars.TFSTATE_STORAGE_ACCOUNT != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    env:
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: latest
          terraform_wrapper: false

      - name: terraform init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
            -backend-config="key=${{ vars.TFSTATE_KEY }}"

      # -lock=false: a read-only plan must never block someone else's apply.
      # The exit code is kept so the comment is posted even when the plan errors.
      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform plan -no-color -input=false -lock=false 2>&1 | tee plan.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Comment plan on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan -->';
            const limit = 60000;

            let plan = fs.readFileSync('infra/terraform/plan.txt', 'utf8');
            if (plan.length > limit) {
              plan = `... truncated, see the job log for the full plan ...\n\n${plan.slice(-limit)}`;
            }

            const body = [
              marker,
              '### Terraform plan',
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```terraform',
              plan,
              '```',
              '',
              '</details>',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail if the plan errored
        run: test "${{ steps.plan.outputs.exit_code }}" = "0"
